name: Browser smoke check
on:
  push:
    branches: [mobile-night-cleanup]
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save --package-lock=false playwright
      - run: npx playwright install --with-deps chromium
      - run: python3 -m http.server 4444 --bind 127.0.0.1 &
      - run: node tools/browser-smoke.cjs
